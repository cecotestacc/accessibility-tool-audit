name: QualiBooth Accessibility Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accessibility-scan:
    name: Accessibility Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run QualiBooth code analysis
        id: qualibooth
        uses: QualiBooth/code-analysis@995530d
        with:
          org-uuid: "${{ secrets.QUALIBOOTH_ORG_UUID }}"
          api-url: https://pipelinein.dev.qualibooth.com
          scan-paths: tests
          project-type: html
      - name: Print issues found
        env:
          ISSUES: "${{ steps.qualibooth.outputs.issues-found }}"
        run: |
          echo "Accessibility issues found: $ISSUES"
